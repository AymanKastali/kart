name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: ty
        run: uv run ty check
      - name: import-linter
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest

  # The deployment itself: `compose up` on an empty database, as ADR-0007 promises.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: compose up
        run: docker compose up --build --wait
      - name: migrate ran and every context has its schema
        run: |
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0
          test "$(docker compose exec -T postgres psql -U kart -d kart -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_name = 'alembic_version'")" = 10
      - name: rabbitmq-setup ran and Debezium is reading the outboxes
        run: |
          test "$(docker compose ps -a rabbitmq-setup --format '{{.ExitCode}}')" = 0
          # Healthy comes a moment before Debezium has attached to the slot.
          for _ in $(seq 30); do
            test "$(docker compose exec -T postgres psql -U kart -d kart -Atc \
              "SELECT active FROM pg_replication_slots WHERE slot_name = 'kart_outbox'")" = t && exit 0
            sleep 2
          done
          exit 1
      - name: keycloak-setup ran
        run: test "$(docker compose ps -a keycloak-setup --format '{{.ExitCode}}')" = 0
      - name: Keycloak signs in the local customer
        run: |
          curl -fsS http://localhost:8080/realms/kart/protocol/openid-connect/token \
            -d grant_type=password -d client_id=kart-api -d username=customer -d password=customer \
            | grep -q '"access_token"'
      - name: the api's traces reach Jaeger
        run: |
          curl -s -o /dev/null http://localhost:8000/v1/storefront
          # The api exports its spans in batches, every few seconds.
          for _ in $(seq 30); do
            curl -fsS http://localhost:16686/api/v3/services | grep -q '"kart-api"' && exit 0
            sleep 2
          done
          exit 1
      - name: logs
        if: failure()
        run: docker compose logs
