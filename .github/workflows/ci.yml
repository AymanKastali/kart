name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: ty
        run: uv run ty check
      - name: import-linter
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest

  # The deployment itself: `compose up` on an empty database, as ADR-0007 promises.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: compose up
        run: docker compose -f deploy/compose.yaml up --build --wait
      - name: migrate ran and every context has its schema
        run: |
          compose="docker compose -f deploy/compose.yaml"
          test "$($compose ps -a migrate --format '{{.ExitCode}}')" = 0
          test "$($compose exec -T postgres psql -U kart -d kart -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_name = 'alembic_version'")" = 10
      - name: topology ran and Debezium is reading the outboxes
        run: |
          compose="docker compose -f deploy/compose.yaml"
          test "$($compose ps -a topology --format '{{.ExitCode}}')" = 0
          # Healthy comes a moment before Debezium has attached to the slot.
          for _ in $(seq 30); do
            test "$($compose exec -T postgres psql -U kart -d kart -Atc \
              "SELECT active FROM pg_replication_slots WHERE slot_name = 'kart_outbox'")" = t && exit 0
            sleep 2
          done
          exit 1
      - name: logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs
