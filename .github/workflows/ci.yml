name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: ty
        run: uv run ty check
      - name: import-linter
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: compose file
        run: docker compose -f deploy/compose.yaml --env-file deploy/.env.example config --quiet
      - name: build
        run: docker build .
