[project]
name = "kart"
version = "0.1.0"
description = "Kart: a learning clone of the noon.com UAE marketplace, as a modular monolith"
requires-python = ">=3.14"
# Upper bounds stop `uv lock --upgrade` from taking a breaking release: below the next
# major from 1.0 on, below the next minor for 0.x packages, where minors can break.
dependencies = [
    "alembic>=1.20.1,<2",
    "email-validator>=2,<3",
    "fastapi>=0.162.2,<0.163",
    "httpx>=0.28.1,<0.29",
    "opentelemetry-api>=1.45.2,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2,<0.67",
    "opentelemetry-instrumentation-urllib>=0.66b2,<0.67",
    "opentelemetry-sdk>=1.45.2,<2",
    "pika>=1.4.4,<2",
    "psycopg[binary]>=3.3.8,<4",
    "pydantic-settings>=2.16.2,<3",
    "pyjwt[crypto]>=2.15.1,<3",
    "sentry-sdk>=2.74.0,<3",
    "sqlalchemy[asyncio]>=2.1.8,<3", # asyncio: the SQLAlchemy tracing imports it
    "uvicorn[standard]>=0.54.0,<0.55",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.16,<3",
    "pylint>=4,<5",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.4,<0.18",
    "testcontainers[postgres,rabbitmq]>=4.15.0,<5",
    "ty>=0.0.99,<0.0.100",
    "vulture>=2.14,<3",
]

[tool.pytest]
testpaths = ["tests"]

[tool.importlinter]
root_package = "kart"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Contexts depend on each other only through their contracts"
type = "independence"
modules = ["kart.contexts.*"]
# The exemption matches nothing until contexts start talking to each other.
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "kart.contexts.** -> kart.contexts.*.contracts",
    "kart.contexts.** -> kart.contexts.*.contracts.**",
]

[[tool.importlinter.contracts]]
name = "The app wires contexts together; contexts build on what they share"
type = "layers"
layers = ["kart.app", "kart.contexts", "kart.shared"]

[[tool.importlinter.contracts]]
# The plumbing may carry the kernel's types, never the other way round.
name = "The shared plumbing builds on the shared kernel"
type = "layers"
containers = ["kart.shared"]
layers = ["inbox : outbox", "kernel"]

[[tool.importlinter.contracts]]
# The shared plumbing has no domain meaning, so only a context's adapters use it.
name = "Only a context's infrastructure and migrations use the shared plumbing"
type = "forbidden"
source_modules = [
    "kart.contexts.*.domain",
    "kart.contexts.*.application",
    "kart.contexts.*.api",
    "kart.contexts.*.contracts",
]
forbidden_modules = ["kart.shared.inbox", "kart.shared.outbox"]

[[tool.importlinter.contracts]]
# The exemption above lets contexts import each other's contracts, so contracts must
# not pass a context's internals through: the internals implement the contracts.
name = "Contracts do not expose their context's internals"
type = "forbidden"
source_modules = ["kart.contexts.*.contracts"]
forbidden_modules = [
    "kart.contexts.*.domain",
    "kart.contexts.*.application",
    "kart.contexts.*.infrastructure",
    "kart.contexts.*.api",
]

[[tool.importlinter.contracts]]
# ADR-0005: only Identity knows how access tokens are made.
name = "Only Identity uses the JWT library"
type = "forbidden"
source_modules = ["kart.app", "kart.shared", "kart.contexts.*"]
forbidden_modules = ["jwt"]
# Others reach the library only through Identity's contracts, which is how it should be.
allow_indirect_imports = true
ignore_imports = ["kart.contexts.identity.** -> jwt"]

[[tool.importlinter.contracts]]
name = "Domain models and the shared kernel are pure Python"
type = "forbidden"
source_modules = ["kart.shared.kernel", "kart.contexts.*.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "pydantic",
    "httpx",
    "pika",
    "jwt",
    "alembic",
]

[[tool.importlinter.contracts]]
# Dependency inversion (CODING_STANDARDS.md): a use case declares a port, a typing.Protocol,
# for anything outside the process, and the app hands it an adapter that implements it.
name = "Use cases reach the outside world only through ports"
type = "forbidden"
source_modules = ["kart.contexts.*.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "pydantic",
    "httpx",
    "pika",
    "jwt",
    "alembic",
]

[[tool.importlinter.contracts]]
# The routes and the adapters both build on the use cases, never on each other: the app
# wires an adapter into a use case. Every layer is optional, so a context grows into them.
name = "A context's layers depend inwards"
type = "layers"
containers = ["kart.contexts.*"]
layers = ["(api) | (infrastructure)", "(application)", "(domain)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # docstrings where they help, not on everything
    "COM812", # conflicts with the formatter
    "CPY",    # no copyright headers
]

[tool.ruff.lint.per-file-ignores]
# pytest asserts, literal expected values, and fixtures, which pytest passes by name
"tests/**" = ["S101", "PLR2004", "PLR0917"]

# An interface is a typing.Protocol, which a class implements by its shape alone.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"abc.ABC".msg = "Declare the interface as a typing.Protocol (CODING_STANDARDS.md)"
"abc.ABCMeta".msg = "Declare the interface as a typing.Protocol (CODING_STANDARDS.md)"
"abc.abstractmethod".msg = "Declare the interface as a typing.Protocol (CODING_STANDARDS.md)"

# Pydantic reads its models' annotations at runtime, so their types are imported for real.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

# Small functions that do one thing (CODING_STANDARDS.md).
[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 4
max-positional-args = 3
max-statements = 15
max-branches = 6
max-returns = 4

# Code nothing uses is dead or speculative. Below 60% confidence it is mostly noise.
[tool.vulture]
paths = ["src", "tests"]
min_confidence = 60
# Pytest, FastAPI and Pydantic call what they decorate.
ignore_decorators = ["@pytest.fixture", "@*.get", "@*.post", "@*.put", "@model_validator"]
ignore_names = [
    "pytestmark",
    # Alembic reads these from every migration.
    "revision",
    "down_revision",
    "branch_labels",
    "depends_on",
    "downgrade",
    # Role's members are read by iterating over Role.
    "CUSTOMER",
    "SELLER",
    "OPERATOR",
]

# Only pylint's duplicate-code check: ruff covers the rest.
[tool.pylint.main]
disable = ["all"]
enable = ["duplicate-code"]
ignore-paths = [".*/migrations/.*"]

[tool.pylint.similarities]
min-similarity-lines = 4

[tool.ty.terminal]
error-on-warning = true
