# The whole deployment: `docker compose up --build --wait`, with nothing to set up first or
# run afterwards. Every service reads `.env.example`, then `.env` if one exists to override it.
# Ports listen on localhost only; to publish one on another host port, set its `*_HOST_PORT`
# variable in the shell or in `.env`, which this file reads too.
name: kart

# Every Kart process runs from the one image.
x-kart: &kart
  build:
    context: .
  env_file: &env
    - .env.example
    - path: .env
      required: false

x-app: &app
  <<: *kart
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    keycloak:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    rabbitmq-setup:
      condition: service_completed_successfully
    keycloak-setup:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    # Logical decoding lets Debezium read the outbox tables (#6).
    command: ["postgres", "-c", "wal_level=logical"]
    env_file: *env
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    env_file: *env
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes: [rabbitmq:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    # Imports the kart realm, its roles, the API's client and a local account per role.
    # An existing realm is left as it is, so its accounts survive a restart.
    command: ["start-dev", "--import-realm"]
    env_file: *env
    volumes:
      - ./keycloak/kart-realm.json:/opt/keycloak/data/import/kart-realm.json:ro
    environment:
      KC_HEALTH_ENABLED: "true"
      # Links in its emails, such as to verify an email address, open in a browser on this
      # machine, while Kart's processes reach it at keycloak:8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["127.0.0.1:${KEYCLOAK_HOST_PORT:-8080}:8080"]
    healthcheck:
      # The image has no curl, so ask the management port's health endpoint with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      retries: 30

  # Catches every email Kart and Keycloak send, so none leaves the machine; its UI shows them.
  # In production, SMTP_* in .env point at Resend instead.
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports: ["127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      retries: 20

  # The local trace viewer: Kart's processes export their spans to it over OTLP, and its UI
  # shows each trace. Traces live in memory, so a restart clears them.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    restart: unless-stopped
    ports: ["127.0.0.1:${JAEGER_HOST_PORT:-16686}:16686"]

  # Brings every context's schema up to date, then exits. It runs on every `up` and is a
  # no-op when nothing changed; the app processes start only once it has succeeded.
  migrate:
    <<: *kart
    command: ["python", "-m", "kart.app.migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # Declares Kart's RabbitMQ exchange and every context's queues, then exits. Declaring is a
  # no-op when they exist.
  rabbitmq-setup:
    <<: *kart
    command: ["python", "-m", "kart.app.rabbitmq_setup"]
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Brings the kart realm's settings (email, email verification, password reset, password
  # policy) up to date, then exits. The realm import above skips an existing realm; this
  # reaches it too, and changes nothing when the settings are already applied.
  keycloak-setup:
    <<: *kart
    command: ["python", "-m", "kart.app.keycloak_setup"]
    depends_on:
      keycloak:
        condition: service_healthy

  # Change data capture: streams every context's outbox from the write-ahead log to the
  # kart.events exchange (ADR-0004). Its offsets live in a volume, so a restart picks up where it left off.
  debezium:
    image: quay.io/debezium/server:3.7.1.Final
    restart: unless-stopped
    env_file: *env
    volumes:
      - ./debezium/application.properties:/debezium/config/application.properties:ro
      - debezium:/debezium/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/q/health"]
      interval: 5s
      retries: 30

  api:
    <<: *app
    ports: ["127.0.0.1:${API_HOST_PORT:-8000}:8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 5s
      retries: 10

  worker:
    <<: *app
    command: ["python", "-m", "kart.app.worker"]

  scheduler:
    <<: *app
    command: ["python", "-m", "kart.app.scheduler"]

volumes:
  postgres:
  rabbitmq:
  debezium:
