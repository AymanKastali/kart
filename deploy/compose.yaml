# The whole deployment: `docker compose -f deploy/compose.yaml up --build --wait`, with nothing
# to set up first or run afterwards. Every service reads `.env.example`, then `.env` if one
# exists to override it. Ports listen on localhost only.
name: kart

# Every Kart process runs from the one image.
x-kart: &kart
  build:
    context: ..
  env_file: &env
    - ../.env.example
    - path: ../.env
      required: false

x-app: &app
  <<: *kart
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    keycloak:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    topology:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    # Logical decoding lets Debezium read the outbox tables (#6).
    command: ["postgres", "-c", "wal_level=logical"]
    env_file: *env
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    env_file: *env
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: [rabbitmq:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start-dev"]
    env_file: *env
    environment:
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      # The image has no curl, so ask the management port's health endpoint with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      retries: 30

  # Brings every context's schema up to date, then exits. It runs on every `up` and is a
  # no-op when nothing changed; the app processes start only once it has succeeded.
  migrate:
    <<: *kart
    command: ["python", "-m", "kart.app.migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # Declares Kart's RabbitMQ exchanges, then exits. Declaring is a no-op when they exist.
  topology:
    <<: *kart
    command: ["python", "-m", "kart.app.topology"]
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Relays every context's outbox from the write-ahead log to the kart.events exchange
  # (ADR-0004). Its offsets live in a volume, so a restart picks up where it left off.
  debezium:
    image: quay.io/debezium/server:3.7.1.Final
    restart: unless-stopped
    env_file: *env
    volumes:
      - ./debezium/application.properties:/debezium/config/application.properties:ro
      - debezium:/debezium/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      topology:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/q/health"]
      interval: 5s
      retries: 30

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 5s
      retries: 10

  worker:
    <<: *app
    command: ["python", "-m", "kart.app.worker"]

  scheduler:
    <<: *app
    command: ["python", "-m", "kart.app.scheduler"]

volumes:
  postgres:
  rabbitmq:
  debezium:
