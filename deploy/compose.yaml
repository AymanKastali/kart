# The local stack. Start it with `docker compose -f deploy/compose.yaml up --build --wait`.
# Every variable has a local default; put overrides in deploy/.env (see .env.example).
# Ports listen on localhost only.
name: kart

x-app: &app
  build:
    context: ..
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-kart}:${POSTGRES_PASSWORD:-kart}@postgres:5432/${POSTGRES_DB:-kart}
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-kart}:${RABBITMQ_PASSWORD:-kart}@rabbitmq:5672/
    KEYCLOAK_URL: http://keycloak:8080
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    keycloak:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:18
    # Logical decoding lets Debezium read the outbox tables (#6).
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kart}
      POSTGRES_DB: ${POSTGRES_DB:-kart}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kart}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-kart}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: [rabbitmq:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      # The image has no curl, so ask the management port's health endpoint with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      retries: 30

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 5s
      retries: 10

  worker:
    <<: *app
    command: ["python", "-m", "kart.app.worker"]

  scheduler:
    <<: *app
    command: ["python", "-m", "kart.app.scheduler"]

volumes:
  postgres:
  rabbitmq:
