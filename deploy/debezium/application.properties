# Debezium Server captures every context's outbox from the write-ahead log (CDC) and publishes it
# to RabbitMQ (ADR-0004). The ${...} values come from the environment, which Compose fills from
# .env.example.

# Source: committed inserts into any `<context>.outbox`, read from the write-ahead log.
# `python -m kart.app.migrate` creates the publication and the slot before anything is written,
# so nothing committed before Debezium first connects is lost.
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=${POSTGRES_HOST}
debezium.source.database.port=5432
debezium.source.database.user=${POSTGRES_USER}
debezium.source.database.password=${POSTGRES_PASSWORD}
debezium.source.database.dbname=${POSTGRES_DB}
debezium.source.topic.prefix=kart
debezium.source.plugin.name=pgoutput
debezium.source.publication.name=outbox
debezium.source.publication.autocreate.mode=disabled
debezium.source.slot.name=${POSTGRES_DB}_outbox
debezium.source.table.include.list=.*\\.outbox
# The outbox is empty, so there is nothing to snapshot. Its deletes aren't events.
debezium.source.snapshot.mode=no_data
debezium.source.skipped.operations=u,d,t
# Where it got to in the log, kept in a volume so a restart resumes from there.
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0

# The Outbox Event Router turns a row into a message: its topic, and so its routing key, is the
# event type, the event id goes in the `id` header, and the body is the payload column: the whole
# event envelope, as written. Header values are JSON, so the id arrives as a quoted string.
debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.route.by.field=type
debezium.transforms.outbox.route.topic.replacement=\\${routedByValue}
debezium.format.value=simplestring
debezium.format.header=json
debezium.format.header.schemas.enable=false

# Sink: the kart.events topic exchange (kart.app.topology declares it), persistent messages.
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=${RABBITMQ_HOST}
debezium.sink.rabbitmq.connection.port=5672
debezium.sink.rabbitmq.connection.username=${RABBITMQ_DEFAULT_USER}
debezium.sink.rabbitmq.connection.password=${RABBITMQ_DEFAULT_PASS}
debezium.sink.rabbitmq.exchange=kart.events
debezium.sink.rabbitmq.routingKey.source=topic
debezium.sink.rabbitmq.deliveryMode=2
